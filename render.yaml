services:
  - type: web
    name: nomae-trust-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: HIVE_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
      - key: EXTENSION_API_KEY
        sync: false
