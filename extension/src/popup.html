<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NomaeTrust</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, sans-serif;
        background: #070b14;
        color: #e2e8f0;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        color: #94a3b8;
      }
      .logo {
        display: block;
        height: 36px;
        width: auto;
        max-width: 100%;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 4px;
        color: #64748b;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #0f172a;
        color: #f1f5f9;
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        color: #4ade80;
      }
      p.hint {
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="../icons/logo.png" alt="NomaeTrust" />
    <h1>Verify extension</h1>
    <p class="hint">Works on reddit.com and discord.com. Click Verify on posts and messages.</p>
    <label for="apiUrl">API URL</label>
    <input id="apiUrl" type="url" placeholder="http://localhost:3001" />
    <label for="apiKey">Extension API Key</label>
    <input id="apiKey" type="password" placeholder="Optional for local dev" />
    <label for="frontendUrl">Frontend URL</label>
    <input id="frontendUrl" type="url" placeholder="http://localhost:5173" />
    <button id="save">Save settings</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
